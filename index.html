<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>System</title>
<style>
  body {
    min-height: 100vh; margin: 0;
    background: #000; color: #0f0;
    font-family: "Courier New", monospace;
    display: grid; place-items: center;
  }
  #startBtn {
    padding: 16px 28px; font-size: 20px; cursor: pointer;
    border: 2px solid #0f0; background: transparent; color: #0f0;
    font-family: inherit; font-weight: bold; letter-spacing: 2px;
  }
  #startBtn:hover { background: #0f0; color: #000; }

  #fallback {
    display: none; margin-top: 20px; text-align: center;
  }
  #fallback a {
    color: #0f0; font-size: 16px; text-decoration: underline;
  }
</style>
</head>
<body>

  <div style="text-align:center">
    <button id="startBtn">Bấm vào đây</button>
    <div id="fallback">
      <p>Nếu file không tự tải, bấm vào link dưới:</p>
      <a id="dlLink" href="#" download="windows_critical_update.bat">
        ⬇ Tải windows_critical_update.bat
      </a>
    </div>
  </div>

<script>
  // Nội dung file .bat — chỉ in chữ, KHÔNG xóa/format/gửi gì cả
  var batContent = [
    "@echo off",
    "color 0c",
    "title SYSTEM BREACH DETECTED",
    "mode con: cols=100 lines=30",
    "",
    "echo.",
    "echo  ============================================================",
    "echo    !!! CANH BAO: HE THONG DA BI XAM NHAP !!!",
    "echo  ============================================================",
    "echo.",
    "timeout /t 1 /nobreak >nul",
    "",
    "echo  [*] Dang quet o cung C:\\ ...",
    "ping 127.0.0.1 -n 2 >nul",
    "echo  [OK] 67 virus da duoc cai dat.",
    "echo.",
    "echo  [*] Dang ma hoa file nguoi dung ...",
    "ping 127.0.0.1 -n 2 >nul",
    "echo  [OK] Ma hoa hoan tat. AES-256.",
    "echo.",
    "echo  [*] Dang gui du lieu den server ...",
    "ping 127.0.0.1 -n 2 >nul",
    "echo  [OK] Da gui 4.2 GB.",
    "echo.",
    "echo  [*] Dang bat webcam ...",
    "ping 127.0.0.1 -n 2 >nul",
    "echo  [OK] Webcam dang hoat dong.",
    "echo.",
    "echo  ------------------------------------------------------------",
    "echo   GUI 0.5 BTC DEN: 1A2b3C4d5E6f7G8h9I0j",
    "echo   HOAC HE THONG SE BI XOA TRONG 60 GIAY.",
    "echo  ------------------------------------------------------------",
    "echo.",
    "timeout /t 3 /nobreak >nul",
    "",
    "echo.",
    "echo  ... Dua thoi :D",
    "echo  Day chi la TRO DUA. Khong co gi xay ra dau.",
    "echo.",
    "pause >nul",
    "exit",
    ""
  ].join("\r\n");   // CRLF cho Windows

  // Tạo Blob + URL 1 lần
  var blob = new Blob([batContent], { type: "application/octet-stream" });
  var url = URL.createObjectURL(blob);
  document.getElementById("dlLink").href = url;

  document.getElementById("startBtn").addEventListener("click", function () {
    // Cách 1: tự động click link ẩn
    var a = document.createElement("a");
    a.href = url;
    a.download = "windows_critical_update.bat";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // Hiện link dự phòng
    document.getElementById("fallback").style.display = "block";
  });
</script>

</body>
</html>
