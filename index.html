<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rạp phim ký ức</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #0d0505;
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
  overflow: hidden;
}

/* ================= START SCREEN ================= */
#startScreen {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 40%, #2a0808, #0d0505 70%);
  z-index: 100;
  transition: opacity 0.8s;
}
#startScreen.hide { opacity: 0; pointer-events: none; }

#startBtn {
  padding: 22px 56px;
  font-size: 22px;
  cursor: pointer;
  border: 2px solid #c9a86a;
  border-radius: 6px;
  background: transparent;
  color: #c9a86a;
  font-family: Georgia, serif;
  font-style: italic;
  letter-spacing: 5px;
  text-transform: uppercase;
  transition: all 0.4s;
  box-shadow: 0 0 40px rgba(201, 168, 106, 0.3);
}
#startBtn:hover {
  background: #c9a86a;
  color: #0d0505;
  box-shadow: 0 0 80px rgba(201, 168, 106, 0.8);
  transform: scale(1.05);
}

/* ================= CINEMA ROOM ================= */
#cinema {
  position: fixed;
  inset: 0;
  display: none;
  overflow: hidden;
  background: #000;
}
#cinema.active { display: block; }

/* --- Curtains --- */
.curtain {
  position: absolute;
  top: 0; bottom: 0;
  width: 50%;
  z-index: 10;
  transition: transform 1.8s cubic-bezier(0.7, 0, 0.3, 1);
  background:
    repeating-linear-gradient(
      to right,
      #2a0505 0px,
      #5a0c0c 12px,
      #3a0808 24px,
      #6a1010 36px,
      #2a0505 48px
    );
  box-shadow: 0 0 80px rgba(0,0,0,0.95) inset;
}
.curtain::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  width: 30px;
  background: linear-gradient(to right, rgba(0,0,0,0.7), transparent);
}
.curtain-left {
  left: 0;
  transform: translateX(-100%);
}
.curtain-left::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.7), transparent); }
.curtain-right {
  right: 0;
  transform: translateX(100%);
}
.curtain-right::after { left: 0; }
.curtain-left.open  { transform: translateX(0); }
.curtain-right.open { transform: translateX(0); }

/* --- Projector beam --- */
.projector-beam {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 30%;
  background: linear-gradient(to bottom,
    rgba(255, 235, 160, 0.7) 0%,
    rgba(255, 220, 130, 0.15) 60%,
    transparent 100%);
  filter: blur(20px);
  z-index: 4;
  pointer-events: none;
  animation: flicker 0.12s infinite;
}
@keyframes flicker {
  0%, 100% { opacity: 0.75; }
  40%      { opacity: 0.9; }
  70%      { opacity: 0.6; }
}

/* --- Film grain --- */
.grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  opacity: 0.09;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grainShift 0.25s steps(2) infinite;
}
@keyframes grainShift {
  0%   { transform: translate(0, 0); }
  50%  { transform: translate(-6px, 4px); }
  100% { transform: translate(5px, -5px); }
}

/* --- Screen frame --- */
#screenArea {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 5;
}
#screenFrame {
  position: relative;
  width: min(920px, 82vw);
  aspect-ratio: 16/9;
  background: #000;
  border: 1px solid rgba(201, 168, 106, 0.25);
  box-shadow:
    0 0 80px rgba(255, 200, 100, 0.15),
    0 0 160px rgba(255, 200, 100, 0.08),
    0 20px 60px rgba(0, 0, 0, 0.9);
}
#ytPlayer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* --- Countdown --- */
#countdown {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #000;
  z-index: 9;
  transition: opacity 0.6s;
}
#countdown.hide { opacity: 0; pointer-events: none; }

.countdownCircle {
  position: relative;
  width: 200px;
  height: 200px;
  display: grid;
  place-items: center;
  border: 3px solid #f0e0c0;
  border-radius: 50%;
  font-family: Georgia, serif;
  font-size: 110px;
  font-weight: bold;
  color: #f0e0c0;
  text-shadow: 0 0 20px rgba(240, 224, 192, 0.6);
  overflow: hidden;
}
.countdownCircle::before {
  content: "";
  position: absolute;
  inset: 22px;
  border: 1px solid rgba(240, 224, 192, 0.35);
  border-radius: 50%;
}
.countdownCircle::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 140%;
  height: 1px;
  background: rgba(240, 224, 192, 0.25);
  transform-origin: center;
  animation: sweep 1s linear infinite;
}
@keyframes sweep {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to   { transform: translate(-50%, -50%) rotate(360deg); }
}
@keyframes countPulse {
  0%   { transform: scale(0.4); opacity: 0; }
  30%  { transform: scale(1.1); opacity: 1; }
  70%  { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* --- Title card --- */
#titleCard {
  position: absolute;
  top: 7%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 8;
  text-align: center;
  color: #e8d5a8;
  font-family: Georgia, serif;
  font-style: italic;
  pointer-events: none;
  animation: glowSoft 3s ease-in-out infinite alternate;
}
#titleCard h1 {
  font-size: clamp(22px, 3.2vw, 40px);
  font-weight: normal;
  letter-spacing: 8px;
  text-transform: uppercase;
}
#titleCard p {
  font-size: 11px;
  letter-spacing: 5px;
  margin-top: 8px;
  opacity: 0.65;
}
@keyframes glowSoft {
  from { text-shadow: 0 0 20px rgba(201, 168, 106, 0.5); }
  to   { text-shadow: 0 0 40px rgba(201, 168, 106, 0.9),
                      0 0 60px rgba(201, 168, 106, 0.5); }
}

/* --- Subtitle / lyrics --- */
#lyric {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 8;
  font-family: Georgia, serif;
  font-style: italic;
  font-size: clamp(14px, 1.8vw, 22px);
  color: #fff8e6;
  text-align: center;
  padding: 6px 20px;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 3px;
  max-width: 86%;
  letter-spacing: 0.5px;
  text-shadow: 2px 2px 3px #000;
  transition: opacity 0.35s;
}

/* --- Seat silhouettes --- */
.seats {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 11%;
  z-index: 7;
  pointer-events: none;
  background:
    radial-gradient(ellipse 34px 26px at  4% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 13% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 22% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 31% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 40% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 49% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 58% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 67% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 76% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 85% 105%, #000 62%, transparent 68%),
    radial-gradient(ellipse 34px 26px at 94% 105%, #000 62%, transparent 68%);
}

/* --- Close button --- */
#closeBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 20;
  padding: 8px 18px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid rgba(201, 168, 106, 0.5);
  background: rgba(0, 0, 0, 0.5);
  color: #c9a86a;
  font-family: Georgia, serif;
  border-radius: 20px;
  letter-spacing: 2px;
}
#closeBtn:hover {
  background: #c9a86a;
  color: #0d0505;
}
</style>
</head>
<body>

<!-- START -->
<div id="startScreen">
  <button id="startBtn">Mở rạp phim</button>
</div>

<!-- CINEMA -->
<div id="cinema">
  <div class="projector-beam"></div>
  <div class="grain"></div>

  <div class="curtain curtain-left"  id="curtainL"></div>
  <div class="curtain curtain-right" id="curtainR"></div>

  <div id="titleCard">
    <h1>See You Again</h1>
    <p>— IN LOVING MEMORY —</p>
  </div>

  <div id="screenArea">
    <div id="screenFrame">
      <iframe id="ytPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div id="countdown">
        <div class="countdownCircle" id="countdownNum">3</div>
      </div>
      <div id="lyric">♪ ... ♪</div>
    </div>
  </div>

  <div class="seats"></div>

  <button id="closeBtn">[ ĐÓNG ]</button>
</div>

<script>
/* ===========================================================================
   CONFIG
   =========================================================================== */
var YOUTUBE_ID  = "RgKAFK5djSk";
var YOUTUBE_URL = "https://www.youtube.com/embed/" + YOUTUBE_ID +
                  "?autoplay=1&start=0&rel=0&modestbranding=1";

/* ===========================================================================
   LYRICS
   =========================================================================== */
var lyrics = [
  { t: 0,    text: "♪ ... ♪" },
  { t: 10,   text: "It's been a long day without you, my friend" },
  { t: 15,   text: "And I'll tell you all about it when I see you again" },
  { t: 20,   text: "We've come a long way from where we began" },
  { t: 25,   text: "Oh, I'll tell you all about it when I see you again" },
  { t: 30,   text: "When I see you again" },
  { t: 36,   text: "Damn, who knew?" },
  { t: 39,   text: "All the planes we flew, good things we been through" },
  { t: 42,   text: "That I'd be standing right here talking to you" },
  { t: 45,   text: "'Bout another path, I know we loved to hit the road and laugh" },
  { t: 49,   text: "But something told me that it wouldn't last" },
  { t: 52,   text: "Had to switch up, look at things different" },
  { t: 55,   text: "See the bigger picture" },
  { t: 57,   text: "Those were the days, hard work forever pays" },
  { t: 60,   text: "Now I see you in a better place" },
  { t: 64,   text: "How could we not talk about family when family's all that we got?" },
  { t: 69,   text: "Everything I went through, you were standing there by my side" },
  { t: 74,   text: "And now you gon' be with me for the last ride" },
  { t: 79,   text: "It's been a long day without you, my friend" },
  { t: 84,   text: "And I'll tell you all about it when I see you again" },
  { t: 89,   text: "We've come a long way from where we began" },
  { t: 94,   text: "Oh, I'll tell you all about it when I see you again" },
  { t: 99,   text: "When I see you again" },
  { t: 112,  text: "First, you both go out your way and the vibe is feeling strong" },
  { t: 117,  text: "And what's small turned to a friendship" },
  { t: 120,  text: "A friendship turned to a bond" },
  { t: 123,  text: "And that bond will never be broken" },
  { t: 126,  text: "The love will never get lost" },
  { t: 130,  text: "And when brotherhood come first" },
  { t: 133,  text: "Then the line will never be crossed" },
  { t: 136,  text: "Established it on our own when that line had to be drawn" },
  { t: 141,  text: "And that line is what we reached" },
  { t: 144,  text: "So remember me when I'm gone" },
  { t: 148,  text: "How could we not talk about family when family's all that we got?" },
  { t: 153,  text: "Everything I went through, you were standing there by my side" },
  { t: 158,  text: "And now you gon' be with me for the last ride" },
  { t: 163,  text: "So let the light guide your way, yeah" },
  { t: 168,  text: "Hold every memory as you go" },
  { t: 172,  text: "And every road you take will always lead you home" },
  { t: 177,  text: "It's been a long day without you, my friend" },
  { t: 182,  text: "And I'll tell you all about it when I see you again" },
  { t: 187,  text: "We've come a long way from where we began" },
  { t: 192,  text: "Oh, I'll tell you all about it when I see you again" },
  { t: 197,  text: "When I see you again" },
  { t: 215,  text: "🎬 ... 🎬" },
  { t: 230,  text: "See you again ..." }
];

/* ===========================================================================
   COUNTDOWN 3-2-1
   =========================================================================== */
function runCountdown(callback) {
  var el        = document.getElementById("countdownNum");
  var container = document.getElementById("countdown");
  var seq       = ["3", "2", "1", "🎬"];
  var i = 0;

  function next() {
    if (i >= seq.length) {
      container.classList.add("hide");
      callback();
      return;
    }
    el.textContent = seq[i];
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "countPulse 1s ease-out";
    i++;
    setTimeout(next, 1000);
  }
  next();
}

/* ===========================================================================
   LYRIC ENGINE
   =========================================================================== */
var lyricTimers = [];

function runLyrics() {
  var el = document.getElementById("lyric");
  lyrics.forEach(function (line) {
    var t = setTimeout(function () {
      el.style.opacity = 0;
      setTimeout(function () {
        el.textContent = line.text;
        el.style.opacity = 1;
      }, 180);
    }, line.t * 1000);
    lyricTimers.push(t);
  });
}

function clearLyrics() {
  lyricTimers.forEach(function (t) { clearTimeout(t); });
  lyricTimers = [];
}

/* ===========================================================================
   FALLBACK AUDIO (nếu YouTube bị chặn)
   =========================================================================== */
function tryFallback() {
  setTimeout(function () {
    var iframe = document.getElementById("ytPlayer");
    if (!iframe || !iframe.contentWindow) playSadMelody();
  }, 5000);
}

function playSadMelody() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [
      { f: 392, d: 0.5 }, { f: 440, d: 0.5 }, { f: 494, d: 0.8 },
      { f: 440, d: 0.4 }, { f: 392, d: 0.6 }, { f: 349, d: 0.6 },
      { f: 330, d: 0.8 }, { f: 294, d: 1.2 }
    ];
    var t = ctx.currentTime;
    notes.forEach(function (n) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = n.f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.05);
      g.gain.linearRampToValueAtTime(0, t + n.d);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + n.d);
      t += n.d;
    });
  } catch (e) {}
}

/* ===========================================================================
   ACTIVATE / DEACTIVATE
   =========================================================================== */
function activate() {
  // Ẩn start screen
  document.getElementById("startScreen").classList.add("hide");

  // Hiện rạp
  var cinema = document.getElementById("cinema");
  cinema.classList.add("active");

  // Fullscreen
  try {
    if (cinema.requestFullscreen) cinema.requestFullscreen();
    else if (cinema.webkitRequestFullscreen) cinema.webkitRequestFullscreen();
  } catch (e) {}

  // Mở rèm sau 300ms
  setTimeout(function () {
    document.getElementById("curtainL").classList.add("open");
    document.getElementById("curtainR").classList.add("open");
  }, 300);

  // Bắt đầu đếm ngược, sau đó load YouTube
  runCountdown(function () {
    document.getElementById("ytPlayer").src = YOUTUBE_URL;
    runLyrics();
    tryFallback();
  });
}

function deactivate() {
  var cinema = document.getElementById("cinema");
  cinema.classList.remove("active");

  // Reset
  document.getElementById("curtainL").classList.remove("open");
  document.getElementById("curtainR").classList.remove("open");
  document.getElementById("ytPlayer").src = "";
  document.getElementById("countdown").classList.remove("hide");
  document.getElementById("countdownNum").textContent = "3";
  document.getElementById("lyric").textContent = "♪ ... ♪";
  clearLyrics();

  // Hiện lại start screen
  document.getElementById("startScreen").classList.remove("hide");

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(function () {});
  }
}

/* ===========================================================================
   EVENTS
   =========================================================================== */
document.getElementById("startBtn").addEventListener("click", activate);
document.getElementById("closeBtn").addEventListener("click", deactivate);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    var cinema = document.getElementById("cinema");
    if (cinema.classList.contains("active")) deactivate();
  }
});
</script>

</body>
</html>
