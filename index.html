<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>System Update</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #000;
    color: #0f0;
    font-family: "Courier New", monospace;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  #startBtn {
    padding: 16px 28px;
    font-size: 20px;
    cursor: pointer;
    border: 2px solid #0f0;
    background: transparent;
    color: #0f0;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #startBtn:hover { background: #0f0; color: #000; }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    color: #f00;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    overflow: hidden;
    animation: shake 0.1s infinite;
  }
  #overlay.active { display: flex; }

  @keyframes shake {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-3px,2px); }
    50%  { transform: translate(2px,-3px); }
    75%  { transform: translate(-2px,-2px); }
    100% { transform: translate(3px,2px); }
  }

  #matrix {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.35;
  }

  #overlay::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.55) 100%);
    animation: pulse 0.7s infinite alternate;
    z-index: 2;
  }
  @keyframes pulse {
    from { opacity: 0.4; }
    to   { opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .glitch {
    font-size: clamp(22px, 6vw, 56px);
    font-weight: bold;
    text-align: center;
    color: #f00;
    text-shadow: 0 0 12px #f00, 0 0 30px #f00;
    animation: blink 0.5s infinite;
    letter-spacing: 2px;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .cam {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 180px;
    height: 130px;
    background: #1a0000;
    border: 2px solid #f00;
    border-radius: 6px;
    z-index: 5;
    box-shadow: 0 0 20px #f00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f55;
    font-size: 12px;
    gap: 6px;
  }
  .cam .rec {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: bold;
  }
  .cam .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #f00;
    animation: blink 0.8s infinite;
  }
  .cam .noise {
    font-size: 28px;
    opacity: 0.5;
    letter-spacing: 2px;
  }

  #terminal {
    width: 100%;
    height: 240px;
    background: rgba(10,0,0,0.85);
    border: 1px solid #f00;
    border-radius: 6px;
    padding: 12px;
    color: #0f0;
    text-align: left;
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
    box-shadow: 0 0 25px #f00 inset;
  }
  #terminal .red    { color: #f55; }
  #terminal .yellow { color: #ff0; }
  #terminal .white  { color: #fff; }

  .progress-wrap {
    width: 100%;
    height: 22px;
    background: #200;
    border: 1px solid #f00;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #800, #f00);
    transition: width 0.2s linear;
  }
  .progress-label {
    position: absolute;
    inset: 0;
    text-align: center;
    font-size: 13px;
    line-height: 22px;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 4px #000;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 13px;
    color: #ff5;
  }

  #closeBtn {
    margin-top: 8px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border: 2px solid #f00;
    background: transparent;
    color: #f00;
    font-family: inherit;
    font-weight: bold;
    border-radius: 6px;
    letter-spacing: 1px;
  }
  #closeBtn:hover { background: #f00; color: #000; }
</style>
</head>
<body>

  <button id="startBtn">Bấm vào đây</button>

  <div id="overlay">
    <canvas id="matrix"></canvas>

    <div class="cam">
      <div class="rec"><span class="dot"></span> REC</div>
      <div class="noise">▓▒░▒▓</div>
      <div>CAM-01 LIVE</div>
    </div>

    <div class="content">
      <div class="glitch">⚠ MÁY TÍNH BẠN ĐÃ BỊ HACK ⚠</div>

      <div class="info-row">
        <span id="ipInfo">IP: ...</span>
        <span id="locInfo">LOC: ...</span>
        <span id="timeInfo">TIME: ...</span>
      </div>

      <div id="terminal"></div>

      <div class="progress-wrap">
        <div class="progress-bar" id="pbar"></div>
        <div class="progress-label" id="plabel">Đang mã hóa ổ cứng... 0%</div>
      </div>

      <button id="closeBtn">[ TẮT ]</button>
    </div>
  </div>

<script>
  // ============================================================
  // ÂM THANH BÁO ĐỘNG 2 TẦNG
  // ============================================================
  let audioCtx = null, osc1 = null, osc2 = null, gainNode = null, alarmInterval = null;

  function startAlarm() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.10;
    gainNode.connect(audioCtx.destination);

    osc1 = audioCtx.createOscillator();
    osc1.type = "sawtooth";
    osc1.frequency.value = 700;
    osc1.connect(gainNode);
    osc1.start();

    osc2 = audioCtx.createOscillator();
    osc2.type = "square";
    osc2.frequency.value = 350;
    osc2.connect(gainNode);
    osc2.start();

    let up = true;
    alarmInterval = setInterval(() => {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      osc1.frequency.linearRampToValueAtTime(up ? 1500 : 500, now + 0.35);
      osc2.frequency.linearRampToValueAtTime(up ? 750 : 250, now + 0.35);
      up = !up;
    }, 380);
  }

  function stopAlarm() {
    if (alarmInterval) clearInterval(alarmInterval);
    alarmInterval = null;
    [osc1, osc2].forEach(o => { if (o) { try { o.stop(); } catch(e){} o.disconnect(); } });
    osc1 = osc2 = null;
    if (gainNode) { gainNode.disconnect(); gainNode = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
  }

  // ============================================================
  // TẢI FILE
  // ============================================================
  function downloadFile(name, content, mime = "text/plain") {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function buildNotepadContent() {
    return `!!!! CANH BAO !!!!

May tinh cua ban da bi xam nhap.

  function downloadAll() {
    // 1. Cảnh báo ngắn
    downloadFile("warning.txt", "67 virus has entrude your pc");

    // 2. File .bat "ghê" — an toàn, chỉ in chữ
    setTimeout(() => {

    // 3. File lộ ra là đùa
    setTimeout(() => {
      downloadFile("DO_NOT_OPEN.txt",
        "Just kidding :D\nDay chi la tro dua, dung hoang.\nBam [ TAT ] de thoat."

  // ============================================================
  // MATRIX RAIN
  // ============================================================
  function initMatrix() {
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    let w, h, cols, drops;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      cols = Math.floor(w / 16);
      drops = Array(cols).fill(1);
    }
    resize();
    window.addEventListener("resize", resize);

    const chars = "01アイウエオカキクケコサシスセソタチツテト";
    setInterval(() => {
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#f00";
      ctx.font = "15px monospace";
      for (let i = 0; i < drops.length; i++) {
        const t = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(t, i * 16, drops[i] * 16);
        if (drops[i] * 16 > h && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }, 45);
  }

  // ============================================================
  // TERMINAL
  // ============================================================
  const lines = [
    { text: "> Initializing exploit framework v6.7 ...", delay: 0 },
    { text: "> Scanning network 192.168.x.x ... [67 hosts found]", delay: 500, cls: "yellow" },
    { text: "> Bypassing Windows Defender ... [BYPASSED]", delay: 1100, cls: "yellow" },
    { text: "> Escalating privileges to SYSTEM ... [ROOT]", delay: 1700, cls: "yellow" },
    { text: "> Injecting 67 trojans into C:\\Windows\\System32 ...", delay: 2300, cls: "red" },
    { text: "> Hijacking webcam + microphone ... [LIVE]", delay: 3000, cls: "red" },
    { text: "> Stealing passwords from Chrome ... [1,247 FOUND]", delay: 3600, cls: "red" },
    { text: "> Encrypting all files with AES-256 ...", delay: 4300, cls: "red" },
    { text: "> Uploading 4.2 GB to darknet-node-67.onion ...", delay: 5000, cls: "red" },
    { text: "> Upload complete.", delay: 5700, cls: "white" },
    { text: "> Just kidding :D — khong co gi dau, binh tinh :))", delay: 6800, cls: "yellow" },
  ];

  function typeLine(line) {
    const term = document.getElementById("terminal");
    const div = document.createElement("div");
    div.className = "line " + (line.cls || "");
    term.appendChild(div);
    let i = 0;
    const iv = setInterval(() => {
      div.textContent += line.text[i++];
      if (i >= line.text.length) clearInterval(iv);
      term.scrollTop = term.scrollHeight;
    }, 16);
  }

  function runTerminal() {
    document.getElementById("terminal").innerHTML = "";
    lines.forEach(l => setTimeout(() => typeLine(l), l.delay));
  }

  // ============================================================
  // PROGRESS BAR
  // ============================================================
  function runProgress() {
    const bar = document.getElementById("pbar");
    const label = document.getElementById("plabel");
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 4 + 1;
      if (p >= 100) { p = 100; clearInterval(iv); label.textContent = "MÃ HÓA HOÀN TẤT ✔"; }
      else label.textContent = `Đang mã hóa ổ cứng... ${Math.floor(p)}%`;
      bar.style.width = p + "%";
    }, 120);
  }

  // ============================================================
  // FAKE INFO
  // ============================================================
  function randomIP() {
    return Array.from({length:4}, () => Math.floor(Math.random()*255)).join(".");
  }
  function updateInfo() {
    document.getElementById("ipInfo").textContent = "IP: " + randomIP();
    document.getElementById("locInfo").textContent = "LOC: " +
      ["Hanoi, VN","HCM, VN","London, UK","Moscow, RU","Unknown"][Math.floor(Math.random()*5)];
    document.getElementById("timeInfo").textContent = "TIME: " + new Date().toLocaleTimeString();
  }

  // ============================================================
  // KHỞI ĐỘNG
  // ============================================================
  document.getElementById("startBtn").addEventListener("click", async () => {
    const overlay = document.getElementById("overlay");
    overlay.classList.add("active");

    try {
      if (overlay.requestFullscreen) await overlay.requestFullscreen();
      else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
    } catch(e) {}

    initMatrix();
    startAlarm();
    runTerminal();
    runProgress();
    downloadAll();
    updateInfo();

    const infoIv = setInterval(updateInfo, 800);

    document.getElementById("closeBtn").addEventListener("click", () => {
      clearInterval(infoIv);
      overlay.classList.remove("active");
      stopAlarm();
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    }, { once: true });
  });
</script>

</body>
</html>
