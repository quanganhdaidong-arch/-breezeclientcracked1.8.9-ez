<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surprise!</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* ============ START BUTTON ============ */
#startBtn {
  padding: 20px 40px;
  font-size: 22px;
  cursor: pointer;
  border: none;
  border-radius: 12px;
  background: linear-gradient(45deg, #ff0066, #ff9900, #00ff99, #0099ff, #ff0066);
  background-size: 400% 400%;
  color: #fff;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: gradientMove 3s ease infinite;
  box-shadow: 0 0 30px rgba(255, 0, 102, 0.7);
  transition: transform 0.2s;
}
#startBtn:hover { transform: scale(1.05); }
#startBtn:active { transform: scale(0.97); }

@keyframes gradientMove {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

/* ============ OVERLAY ============ */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow: hidden;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: bgCycle 4s infinite;
}
#overlay.active { display: flex; }

@keyframes bgCycle {
  0%   { background: #ff0066; }
  25%  { background: #ff9900; }
  50%  { background: #00ff99; }
  75%  { background: #0099ff; }
  100% { background: #ff0066; }
}

/* ============ YOUTUBE PLAYER ============ */
#player-wrap {
  position: relative;
  z-index: 3;
  width: min(720px, 90vw);
  aspect-ratio: 16/9;
  border: 4px solid #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 50px rgba(0,0,0,0.6);
  background: #000;
}
#player-wrap iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* ============ DANCING EMOJIS ============ */
.dancer {
  position: absolute;
  font-size: 70px;
  z-index: 2;
  animation: dance 0.6s infinite alternate;
  pointer-events: none;
  filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}
@keyframes dance {
  from { transform: translateY(0) rotate(-15deg) scale(1); }
  to   { transform: translateY(-30px) rotate(15deg) scale(1.15); }
}

/* ============ LYRIC BOX ============ */
#lyric {
  position: absolute;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  font-size: clamp(20px, 4vw, 38px);
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 10px #000, 0 0 20px #000, 3px 3px 0 #000;
  text-align: center;
  padding: 10px 24px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 12px;
  max-width: 90%;
  transition: opacity 0.3s;
  letter-spacing: 1px;
}

/* ============ TOP TEXT ============ */
#topText {
  position: absolute;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  font-size: clamp(24px, 5vw, 52px);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 0 20px #ff0066, 0 0 40px #000, 4px 4px 0 #000;
  letter-spacing: 3px;
  text-transform: uppercase;
  animation: pulseText 0.5s infinite alternate;
  text-align: center;
}
@keyframes pulseText {
  from { transform: translateX(-50%) scale(1); }
  to   { transform: translateX(-50%) scale(1.08); }
}

/* ============ CONFETTI ============ */
.confetti {
  position: absolute;
  width: 12px;
  height: 12px;
  z-index: 1;
  animation: fall linear infinite;
  pointer-events: none;
}
@keyframes fall {
  from { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  to   { transform: translateY(100vh) rotate(720deg); opacity: 0.7; }
}

/* ============ CLOSE BUTTON ============ */
#closeBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 10;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  border: 2px solid #fff;
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-weight: bold;
  border-radius: 8px;
  letter-spacing: 1px;
}
#closeBtn:hover { background: #fff; color: #000; }
</style>
</head>
<body>

  <button id="startBtn">Bấm vào đây 🎁</button>

  <div id="overlay">
    <div id="topText">🎵 NEVER GONNA GIVE YOU UP 🎵</div>

    <div id="player-wrap">
      <iframe
        id="ytPlayer"
        src=""
        allow="autoplay; encrypted-media"
        allowfullscreen
        title="Rickroll">
      </iframe>
    </div>

    <div id="lyric">♪ ... ♪</div>

    <button id="closeBtn">[ TẮT ]</button>
  </div>

<script>
/* ===========================================================================
   CONFIG
   =========================================================================== */
var YOUTUBE_ID = "dQw4w9WgXcQ";   // Rick Astley - Never Gonna Give You Up
var YOUTUBE_URL = "https://www.youtube.com/embed/" + YOUTUBE_ID +
                  "?autoplay=1&start=0&rel=0&modestbranding=1";

/* ===========================================================================
   LYRICS + TIMING (giây)
   =========================================================================== */
var lyrics = [
  { t: 0,   text: "♪ ... ♪" },
  { t: 1,   text: "We're no strangers to love" },
  { t: 4,   text: "You know the rules and so do I" },
  { t: 7.5, text: "A full commitment's what I'm thinking of" },
  { t: 11,  text: "You wouldn't get this from any other guy" },
  { t: 15,  text: "I just wanna tell you how I'm feeling" },
  { t: 18.5,text: "Gotta make you understand" },
  { t: 21.5,text: "🎵 Never gonna give you up 🎵" },
  { t: 24.5,text: "Never gonna let you down" },
  { t: 27,  text: "Never gonna run around and desert you" },
  { t: 30,  text: "Never gonna make you cry" },
  { t: 33,  text: "Never gonna say goodbye" },
  { t: 35.5,text: "Never gonna tell a lie and hurt you" },
  { t: 42,  text: "We've known each other for so long" },
  { t: 45.5,text: "Your heart's been aching but you're too shy to say it" },
  { t: 49,  text: "Inside we both know what's been going on" },
  { t: 52.5,text: "We know the game and we're gonna play it" },
  { t: 56,  text: "And if you ask me how I'm feeling" },
  { t: 59.5,text: "Don't tell me you're too blind to see" },
  { t: 63,  text: "🎵 Never gonna give you up 🎵" },
  { t: 66,  text: "Never gonna let you down" },
  { t: 68.5,text: "Never gonna run around and desert you" },
  { t: 71.5,text: "Never gonna make you cry" },
  { t: 74,  text: "Never gonna say goodbye" },
  { t: 76.5,text: "Never gonna tell a lie and hurt you" },
  { t: 79,  text: "🎵 Never gonna give you up 🎵" },
  { t: 82,  text: "Never gonna let you down" },
  { t: 84.5,text: "Never gonna run around and desert you" },
  { t: 87.5,text: "Never gonna make you cry" },
  { t: 90,  text: "Never gonna say goodbye" },
  { t: 92.5,text: "Never gonna tell a lie and hurt you" },
  { t: 96,  text: "🎉 YOU GOT RICKROLLED! 🎉" },
  { t: 120, text: "🎵 ... ♪ (still playing ...)" }
];

/* ===========================================================================
   DANCING EMOJIS
   =========================================================================== */
var dancerEmojis = ["🕺", "💃", "🕺", "💃", "🕺", "💃", "🎩", "🎤"];

function spawnDancers() {
  var overlay = document.getElementById("overlay");
  for (var i = 0; i < dancerEmojis.length; i++) {
    var d = document.createElement("div");
    d.className = "dancer";
    d.textContent = dancerEmojis[i];
    d.style.left = (5 + i * 12 + Math.random() * 4) + "%";
    d.style.top  = (10 + Math.random() * 60) + "%";
    d.style.animationDelay = (Math.random() * 0.6) + "s";
    d.style.animationDuration = (0.4 + Math.random() * 0.4) + "s";
    overlay.appendChild(d);
  }
}

/* ===========================================================================
   CONFETTI
   =========================================================================== */
var confettiColors = ["#ff0066","#ff9900","#ffff00","#00ff99","#0099ff","#cc00ff","#ffffff"];

function spawnConfetti(count) {
  var overlay = document.getElementById("overlay");
  for (var i = 0; i < count; i++) {
    var c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "%";
    c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    c.style.animationDuration = (2.5 + Math.random() * 3) + "s";
    c.style.animationDelay = (Math.random() * 3) + "s";
    c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    overlay.appendChild(c);
  }
}

/* ===========================================================================
   LYRIC ENGINE
   =========================================================================== */
var lyricTimers = [];

function runLyrics() {
  var el = document.getElementById("lyric");
  lyrics.forEach(function (line) {
    var t = setTimeout(function () {
      el.style.opacity = 0;
      setTimeout(function () {
        el.textContent = line.text;
        el.style.opacity = 1;
      }, 150);
    }, line.t * 1000);
    lyricTimers.push(t);
  });
}

function clearLyrics() {
  lyricTimers.forEach(function (t) { clearTimeout(t); });
  lyricTimers = [];
}

/* ===========================================================================
   AUDIO FALLBACK (nếu YouTube bị chặn)
   =========================================================================== */
function tryPlayFallbackAudio() {
  // Nếu sau 3 giây iframe chưa load được (bị chặn), phát tiếng beep vui
  setTimeout(function () {
    var iframe = document.getElementById("ytPlayer");
    if (!iframe || !iframe.contentWindow) {
      playBeepMelody();
    }
  }, 3000);
}

function playBeepMelody() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var notes = [523, 587, 659, 698, 784, 880, 988, 1047]; // C D E F G A B C
    notes.forEach(function (freq, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.value = 0.08;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.2);
      osc.stop(ctx.currentTime + i * 0.2 + 0.18);
    });
  } catch (e) {}
}

/* ===========================================================================
   ACTIVATE / DEACTIVATE
   =========================================================================== */
var confettiInterval = null;

function activate() {
  var overlay = document.getElementById("overlay");
  overlay.classList.add("active");

  // Fullscreen
  try {
    if (overlay.requestFullscreen) overlay.requestFullscreen();
    else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
  } catch (e) {}

  // Load YouTube
  document.getElementById("ytPlayer").src = YOUTUBE_URL;

  // Effects
  spawnDancers();
  spawnConfetti(80);
  confettiInterval = setInterval(function () { spawnConfetti(15); }, 2500);

  // Lyrics
  runLyrics();

  // Fallback audio nếu YT bị chặn
  tryPlayFallbackAudio();
}

function deactivate() {
  var overlay = document.getElementById("overlay");
  overlay.classList.remove("active");

  // Dừng YouTube
  document.getElementById("ytPlayer").src = "";

  // Dừng effects
  if (confettiInterval) clearInterval(confettiInterval);
  confettiInterval = null;
  clearLyrics();

  // Xóa dancers + confetti
  var els = overlay.querySelectorAll(".dancer, .confetti");
  els.forEach(function (el) { el.remove(); });

  // Reset lyric
  document.getElementById("lyric").textContent = "♪ ... ♪";

  // Thoát fullscreen
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(function () {});
  }
}

/* ===========================================================================
   EVENTS
   =========================================================================== */
document.getElementById("startBtn").addEventListener("click", activate);
document.getElementById("closeBtn").addEventListener("click", deactivate);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    var overlay = document.getElementById("overlay");
    if (overlay.classList.contains("active")) deactivate();
  }
});
</script>

</body>
</html>
