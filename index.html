<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>See You Again</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #0a0a1a;
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* ============ START BUTTON ============ */
#startBtn {
  padding: 18px 44px;
  font-size: 20px;
  cursor: pointer;
  border: 2px solid #c9a86a;
  border-radius: 50px;
  background: transparent;
  color: #e8d5a8;
  font-family: Georgia, serif;
  font-style: italic;
  letter-spacing: 2px;
  transition: all 0.4s ease;
  box-shadow: 0 0 30px rgba(201, 168, 106, 0.4);
}
#startBtn:hover {
  background: #c9a86a;
  color: #0a0a1a;
  box-shadow: 0 0 60px rgba(201, 168, 106, 0.8);
  transform: scale(1.05);
}
#startBtn:active { transform: scale(0.98); }

/* ============ OVERLAY ============ */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow: hidden;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 20%, #1a1a3a 0%, #0a0a1a 60%, #050510 100%);
}
#overlay.active { display: flex; }

/* ============ STARS ============ */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 3s infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.5); }
}

/* ============ FLOATING LANTERNS ============ */
.lantern {
  position: absolute;
  font-size: 28px;
  z-index: 1;
  animation: floatUp linear infinite;
  pointer-events: none;
  opacity: 0.85;
  filter: drop-shadow(0 0 12px #ffaa44);
}
@keyframes floatUp {
  from { transform: translateY(100vh) translateX(0) scale(0.9); opacity: 0; }
  10%  { opacity: 0.9; }
  90%  { opacity: 0.9; }
  to   { transform: translateY(-20vh) translateX(30px) scale(1.1); opacity: 0; }
}

/* ============ FALLING PETALS ============ */
.petal {
  position: absolute;
  width: 14px;
  height: 14px;
  background: radial-gradient(circle, #ffccdd, #cc6688);
  border-radius: 50% 0 50% 50%;
  z-index: 1;
  animation: fallDown linear infinite;
  pointer-events: none;
  opacity: 0.7;
}
@keyframes fallDown {
  from { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.7; }
  to   { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ============ TOP TITLE ============ */
#topText {
  position: absolute;
  top: 4%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-size: clamp(20px, 3.6vw, 40px);
  font-weight: normal;
  color: #e8d5a8;
  font-family: Georgia, serif;
  font-style: italic;
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(201, 168, 106, 0.8),
               0 0 40px rgba(201, 168, 106, 0.4);
  text-align: center;
  animation: glowSoft 3s infinite alternate;
}
@keyframes glowSoft {
  from { text-shadow: 0 0 20px rgba(201, 168, 106, 0.6),
                      0 0 40px rgba(201, 168, 106, 0.3); }
  to   { text-shadow: 0 0 30px rgba(201, 168, 106, 1),
                      0 0 60px rgba(201, 168, 106, 0.6); }
}

/* ============ YOUTUBE PLAYER ============ */
#player-wrap {
  position: relative;
  z-index: 3;
  width: min(760px, 88vw);
  aspect-ratio: 16/9;
  border: 2px solid rgba(201, 168, 106, 0.6);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(201, 168, 106, 0.4),
              0 0 120px rgba(80, 60, 150, 0.5);
  background: #000;
}
#player-wrap iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* ============ POLAROID MEMORY ============ */
.polaroid {
  position: absolute;
  width: 130px;
  height: 160px;
  background: #fdfdf5;
  padding: 8px 8px 30px 8px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  z-index: 2;
  pointer-events: none;
  animation: sway 6s ease-in-out infinite;
}
.polaroid .photo {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #4a4a8a, #8a5a8a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}
.polaroid .caption {
  position: absolute;
  bottom: 6px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: "Brush Script MT", cursive;
  font-size: 13px;
  color: #555;
}
@keyframes sway {
  0%, 100% { transform: rotate(-4deg) translateY(0); }
  50%      { transform: rotate(4deg) translateY(-10px); }
}

/* ============ LYRIC BOX ============ */
#lyric {
  position: absolute;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  font-size: clamp(16px, 2.6vw, 28px);
  color: #fff;
  font-family: Georgia, serif;
  font-style: italic;
  text-align: center;
  padding: 12px 28px;
  background: rgba(10, 10, 26, 0.55);
  border: 1px solid rgba(201, 168, 106, 0.4);
  border-radius: 12px;
  max-width: 90%;
  letter-spacing: 1px;
  text-shadow: 0 0 10px rgba(201, 168, 106, 0.6);
  transition: opacity 0.4s ease;
  backdrop-filter: blur(4px);
}

/* ============ CLOSE BUTTON ============ */
#closeBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 10;
  padding: 8px 18px;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid rgba(201, 168, 106, 0.6);
  background: rgba(10, 10, 26, 0.5);
  color: #e8d5a8;
  font-family: Georgia, serif;
  border-radius: 20px;
  letter-spacing: 1px;
}
#closeBtn:hover {
  background: #c9a86a;
  color: #0a0a1a;
}

/* ============ QUOTE CORNER ============ */
#quote {
  position: absolute;
  bottom: 4%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  font-size: 12px;
  color: rgba(232, 213, 168, 0.7);
  font-style: italic;
  letter-spacing: 2px;
  text-align: center;
  font-family: Georgia, serif;
}
</style>
</head>
<body>

  <button id="startBtn">🎵 Bấm vào đây</button>

  <div id="overlay">
    <div id="topText">See You Again</div>

    <div id="player-wrap">
      <iframe
        id="ytPlayer"
        src=""
        allow="autoplay; encrypted-media"
        allowfullscreen
        title="See You Again">
      </iframe>
    </div>

    <div id="lyric">♪ ... ♪</div>

    <div id="quote">— In loving memory of the ones we miss —</div>

    <button id="closeBtn">[ TẮT ]</button>
  </div>

<script>
/* ===========================================================================
   CONFIG
   =========================================================================== */
var YOUTUBE_ID  = "RgKAFK5djSk";  // Wiz Khalifa ft. Charlie Puth - See You Again
var YOUTUBE_URL = "https://www.youtube.com/embed/" + YOUTUBE_ID +
                  "?autoplay=1&start=0&rel=0&modestbranding=1";

/* ===========================================================================
   LYRICS + TIMING (giây)
   =========================================================================== */
var lyrics = [
  { t: 0,    text: "♪ ... ♪" },
  { t: 10,   text: "It's been a long day without you, my friend" },
  { t: 15,   text: "And I'll tell you all about it when I see you again" },
  { t: 20,   text: "We've come a long way from where we began" },
  { t: 25,   text: "Oh, I'll tell you all about it when I see you again" },
  { t: 30,   text: "When I see you again" },
  { t: 35,   text: "Damn, who knew?" },
  { t: 38,   text: "All the planes we flew, good things we been through" },
  { t: 41,   text: "That I'd be standing right here talking to you" },
  { t: 44,   text: "'Bout another path, I know we loved to hit the road and laugh" },
  { t: 48,   text: "But something told me that it wouldn't last" },
  { t: 51,   text: "Had to switch up, look at things different" },
  { t: 54,   text: "See the bigger picture" },
  { t: 56,   text: "Those were the days, hard work forever pays" },
  { t: 59,   text: "Now I see you in a better place" },
  { t: 63,   text: "How could we not talk about family when family's all that we got?" },
  { t: 68,   text: "Everything I went through, you were standing there by my side" },
  { t: 73,   text: "And now you gon' be with me for the last ride" },
  { t: 78,   text: "It's been a long day without you, my friend" },
  { t: 83,   text: "And I'll tell you all about it when I see you again" },
  { t: 88,   text: "We've come a long way from where we began" },
  { t: 93,   text: "Oh, I'll tell you all about it when I see you again" },
  { t: 98,   text: "When I see you again" },
  { t: 110,  text: "First, you both go out your way and the vibe is feeling strong" },
  { t: 115,  text: "And what's small turned to a friendship" },
  { t: 118,  text: "A friendship turned to a bond" },
  { t: 121,  text: "And that bond will never be broken" },
  { t: 124,  text: "The love will never get lost" },
  { t: 128,  text: "And when brotherhood come first" },
  { t: 131,  text: "Then the line will never be crossed" },
  { t: 134,  text: "Established it on our own when that line had to be drawn" },
  { t: 139,  text: "And that line is what we reached" },
  { t: 142,  text: "So remember me when I'm gone" },
  { t: 146,  text: "How could we not talk about family when family's all that we got?" },
  { t: 151,  text: "Everything I went through, you were standing there by my side" },
  { t: 156,  text: "And now you gon' be with me for the last ride" },
  { t: 161,  text: "So let the light guide your way, yeah" },
  { t: 166,  text: "Hold every memory as you go" },
  { t: 170,  text: "And every road you take will always lead you home" },
  { t: 175,  text: "It's been a long day without you, my friend" },
  { t: 180,  text: "And I'll tell you all about it when I see you again" },
  { t: 185,  text: "We've come a long way from where we began" },
  { t: 190,  text: "Oh, I'll tell you all about it when I see you again" },
  { t: 195,  text: "When I see you again" },
  { t: 210,  text: "🎵 ... 🎵" },
  { t: 225,  text: "See you again ..." }
];

/* ===========================================================================
   STARS
   =========================================================================== */
function spawnStars(count) {
  var overlay = document.getElementById("overlay");
  for (var i = 0; i < count; i++) {
    var s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top  = Math.random() * 100 + "%";
    s.style.width  = (1 + Math.random() * 2) + "px";
    s.style.height = s.style.width;
    s.style.animationDelay = (Math.random() * 3) + "s";
    s.style.animationDuration = (2 + Math.random() * 3) + "s";
    overlay.appendChild(s);
  }
}

/* ===========================================================================
   FLOATING LANTERNS
   =========================================================================== */
var lanternEmojis = ["🏮", "🕯️", "🕊️", "✨", "💫"];

function spawnLanterns(count) {
  var overlay = document.getElementById("overlay");
  for (var i = 0; i < count; i++) {
    var l = document.createElement("div");
    l.className = "lantern";
    l.textContent = lanternEmojis[Math.floor(Math.random() * lanternEmojis.length)];
    l.style.left = Math.random() * 100 + "%";
    l.style.animationDuration = (12 + Math.random() * 10) + "s";
    l.style.animationDelay = (Math.random() * 12) + "s";
    l.style.fontSize = (20 + Math.random() * 20) + "px";
    overlay.appendChild(l);
  }
}

/* ===========================================================================
   FALLING PETALS
   =========================================================================== */
function spawnPetals(count) {
  var overlay = document.getElementById("overlay");
  for (var i = 0; i < count; i++) {
    var p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (8 + Math.random() * 8) + "s";
    p.style.animationDelay = (Math.random() * 8) + "s";
    p.style.width = p.style.height = (8 + Math.random() * 10) + "px";
    overlay.appendChild(p);
  }
}

/* ===========================================================================
   POLAROID MEMORIES
   =========================================================================== */
var memories = [
  { emoji: "🌅", caption: "Those days" },
  { emoji: "🎸", caption: "Our song" },
  { emoji: "🏍️", caption: "Last ride" },
  { emoji: "🌊", caption: "Summer '19" },
  { emoji: "⭐", caption: "Forever" }
];

function spawnPolaroids() {
  var overlay = document.getElementById("overlay");
  var positions = [
    { left: "3%",  top: "18%" },
    { left: "88%", top: "22%" },
    { left: "5%",  top: "62%" },
    { left: "88%", top: "65%" },
    { left: "45%", top: "2%"  }
  ];
  memories.forEach(function (m, i) {
    var p = document.createElement("div");
    p.className = "polaroid";
    p.style.left = positions[i].left;
    p.style.top  = positions[i].top;
    p.style.animationDelay = (i * 0.8) + "s";
    p.innerHTML =
      '<div class="photo">' + m.emoji + '</div>' +
      '<div class="caption">' + m.caption + '</div>';
    overlay.appendChild(p);
  });
}

/* ===========================================================================
   LYRIC ENGINE
   =========================================================================== */
var lyricTimers = [];

function runLyrics() {
  var el = document.getElementById("lyric");
  lyrics.forEach(function (line) {
    var t = setTimeout(function () {
      el.style.opacity = 0;
      setTimeout(function () {
        el.textContent = line.text;
        el.style.opacity = 1;
      }, 200);
    }, line.t * 1000);
    lyricTimers.push(t);
  });
}

function clearLyrics() {
  lyricTimers.forEach(function (t) { clearTimeout(t); });
  lyricTimers = [];
}

/* ===========================================================================
   AUDIO FALLBACK (nếu YouTube bị chặn)
   =========================================================================== */
function tryPlayFallbackAudio() {
  setTimeout(function () {
    var iframe = document.getElementById("ytPlayer");
    if (!iframe || !iframe.contentWindow) {
      playGentleMelody();
    }
  }, 3000);
}

function playGentleMelody() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Giai điệu nhẹ nhàng - hợp âm buồn
    var notes = [
      { f: 392, d: 0.5 },  // G
      { f: 440, d: 0.5 },  // A
      { f: 494, d: 0.8 },  // B
      { f: 440, d: 0.4 },  // A
      { f: 392, d: 0.6 },  // G
      { f: 349, d: 0.6 },  // F
      { f: 330, d: 0.8 },  // E
      { f: 294, d: 1.0 }   // D
    ];
    var time = ctx.currentTime;
    notes.forEach(function (n) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(0.08, time + 0.05);
      gain.gain.linearRampToValueAtTime(0, time + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + n.d);
      time += n.d;
    });
  } catch (e) {}
}

/* ===========================================================================
   ACTIVATE / DEACTIVATE
   =========================================================================== */
function activate() {
  var overlay = document.getElementById("overlay");
  overlay.classList.add("active");

  // Fullscreen
  try {
    if (overlay.requestFullscreen) overlay.requestFullscreen();
    else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
  } catch (e) {}

  // Load YouTube
  document.getElementById("ytPlayer").src = YOUTUBE_URL;

  // Effects
  spawnStars(120);
  spawnLanterns(12);
  spawnPetals(30);
  spawnPolaroids();

  // Lyrics
  runLyrics();

  // Fallback audio nếu YT bị chặn
  tryPlayFallbackAudio();
}

function deactivate() {
  var overlay = document.getElementById("overlay");
  overlay.classList.remove("active");

  // Dừng YouTube
  document.getElementById("ytPlayer").src = "";

  // Dừng lyrics
  clearLyrics();

  // Xóa effects
  var els = overlay.querySelectorAll(".star, .lantern, .petal, .polaroid");
  els.forEach(function (el) { el.remove(); });

  // Reset lyric
  document.getElementById("lyric").textContent = "♪ ... ♪";

  // Thoát fullscreen
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(function () {});
  }
}

/* ===========================================================================
   EVENTS
   =========================================================================== */
document.getElementById("startBtn").addEventListener("click", activate);
document.getElementById("closeBtn").addEventListener("click", deactivate);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    var overlay = document.getElementById("overlay");
    if (overlay.classList.contains("active")) deactivate();
  }
});
</script>

</body>
</html>
