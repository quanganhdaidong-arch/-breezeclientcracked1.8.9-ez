<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prank</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #0f0;
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
    }

    #startBtn {
      padding: 14px 24px;
      font-size: 20px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #0f0;
      color: #000;
      font-weight: bold;
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: #f00;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      font-size: clamp(28px, 8vw, 72px);
      margin: 0 0 16px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #closeBtn {
      margin-top: 24px;
      padding: 12px 22px;
      font-size: 18px;
      cursor: pointer;
      border: 2px solid #f00;
      background: transparent;
      color: #f00;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <button id="startBtn">Bấm vào đây</button>

  <div id="overlay">
    <h1>MÁY TÍNH BẠN ĐÃ BỊ HACK!</h1>
    <p>Đây chỉ là trò đùa. Bấm nút bên dưới để tắt.</p>
    <button id="closeBtn">TẮT</button>
  </div>

  <script>
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let alarmInterval = null;

    function startAlarm() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      oscillator = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      oscillator.type = "sawtooth";
      oscillator.frequency.value = 800;
      gainNode.gain.value = 0.05;

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();

      let up = true;
      alarmInterval = setInterval(() => {
        if (!audioCtx || !oscillator) return;
        const now = audioCtx.currentTime;
        const target = up ? 1200 : 600;
        oscillator.frequency.linearRampToValueAtTime(target, now + 0.4);
        up = !up;
      }, 450);
    }

    function stopAlarm() {
      if (alarmInterval) clearInterval(alarmInterval);
      alarmInterval = null;

      if (oscillator) {
        try { oscillator.stop(); } catch (e) {}
        oscillator.disconnect();
        oscillator = null;
      }

      if (gainNode) {
        gainNode.disconnect();
        gainNode = null;
      }

      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("overlay").style.display = "flex";
      startAlarm();
    });

    document.getElementById("closeBtn").addEventListener("click", () => {
      document.getElementById("overlay").style.display = "none";
      stopAlarm();
    });
  </script>

</body>
</html>
